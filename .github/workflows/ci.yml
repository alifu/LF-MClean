name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with release.yml.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic
      - name: Test
        run: cargo test --locked

  audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shell syntax
        run: sh -n scripts/release/check-version.sh && sh -n scripts/release/make-formula.sh
      - name: Formula can be made
        run: sh scripts/release/make-formula.sh "$(sh scripts/release/check-version.sh)" "$(printf 'x' | sha256sum | cut -d ' ' -f 1)"
